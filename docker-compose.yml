services:
  openldap:
    image: bitnami/openldap:2.6
    ports:
      - "389:1389"
    environment:
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: admin
      LDAP_ROOT: dc=company,dc=com
      LDAP_SKIP_DEFAULT_TREE: "yes"
    volumes:
      - ./ldap/bootstrap.ldif:/ldifs/00-bootstrap.ldif:ro
